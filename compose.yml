services:
  bot:
    build: .
    image: image-converter-bot:latest
    restart: unless-stopped
    # Give in-flight conversions time to finish on `docker compose stop` (the bot waits up to 20s).
    stop_grace_period: 30s
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN in .env}
      DATABASE_PATH: /data/bot.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_COUNT: ${WORKER_COUNT:-2}
      WORK_QUEUE_SIZE: ${WORK_QUEUE_SIZE:-32}
      MAX_INPUT_FILE_SIZE: ${MAX_INPUT_FILE_SIZE:-52428800}
      MAX_INPUT_PIXELS: ${MAX_INPUT_PIXELS:-100000000}
      DISCORD_DEV_GUILD_ID: ${DISCORD_DEV_GUILD_ID:-}
    volumes:
      # Must be writable by UID 10001 (the container user): mkdir -p data && sudo chown 10001:10001 data
      - ./data:/data
