name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# govips needs CGO and libvips headers even to vet or lint, so the Go jobs run in the
# same Debian release the Dockerfile builds from, with the same packages installed.
jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.26-trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install libvips
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libvips-dev libheif-plugin-libde265

      - uses: actions/cache@v4
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: gofmt
        # gofmt exits zero even when it has complaints, so the output is what
        # has to be checked.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go mod tidy
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod/go.sum are not tidy — run 'go mod tidy' and commit the result" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        # Runs against real libvips, including the HEIC fixture decode.
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    container: golang:1.26-trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install libvips
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libvips-dev libheif-plugin-libde265

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: golangci/golangci-lint-action@v7
        with:
          # Pinned rather than "latest": a new golangci-lint release adding a
          # rule is otherwise a build break with no code change to explain it.
          version: v2.12.2

  build-image:
    # main gets `edge` + short sha; a v1.2.3 tag gets 1.2.3, 1.2 and latest.
    # The Dockerfile runs `bot -selfcheck` in the runtime stage, so an image that
    # cannot decode HEIC fails here instead of being published.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: [test, lint]
    runs-on: ubuntu-latest
    concurrency:
      group: build-image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
